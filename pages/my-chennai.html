<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chennai | Chennai Pulse</title>
    
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    
    <link rel="stylesheet" href="../css/pages/profile.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <nav class="navbar scrolled">
        <div class="container nav-container">
            <a href="../index.html" class="nav-logo">CHENNAI <span>PULSE</span></a>
            
            <button class="menu-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="explore.html" class="nav-link">Explore</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="insights.html" class="nav-link">Insights</a>
                <a href="report.html" class="nav-link">Report</a>
                <a href="my-chennai.html" class="nav-link active">My Chennai</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="container">
            <div class="profile-header reveal">
                <h1>My Chennai</h1>
                <p>Your personal space in the simulated city.</p>
            </div>
            
            <div class="dashboard-layout">
                <!-- Main Content Area -->
                <div class="main-panel">
                    
                    <div class="reveal" style="transition-delay: 0.1s;">
                        <h2 class="section-title">Saved Areas</h2>
                        <div id="saved-areas-container" class="saved-areas-grid">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                    
                    <div class="reveal" style="transition-delay: 0.2s; margin-top: var(--spacing-8);">
                        <h2 class="section-title">My Reports</h2>
                        <div id="reports-container" class="reports-list">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                    
                </div>
                
                <!-- Side Panel -->
                <div class="side-panel">
                    
                    <div class="card bg-glass habit-card reveal-right" style="transition-delay: 0.3s;">
                        <h3>Habit Score</h3>
                        <div id="my-habit-score" class="habit-score-display">-</div>
                        <a href="insights.html" class="btn btn-secondary btn-sm" style="width: 100%;">Recalculate</a>
                    </div>
                    
                    <div class="card bg-glass reveal-right" style="transition-delay: 0.4s;">
                        <h3 style="margin-bottom: var(--spacing-4);">Preferences</h3>
                        
                        <div class="pref-group">
                            <label class="pref-label">Theme</label>
                            <select id="pref-theme" class="form-control">
                                <option value="dark">Cinematic Dark</option>
                                <option value="light">Daylight</option>
                            </select>
                        </div>
                        
                        <div class="pref-group">
                            <label class="pref-label">Motion</label>
                            <select id="pref-motion" class="form-control">
                                <option value="full">Full Animation</option>
                                <option value="reduced">Reduced Motion</option>
                            </select>
                        </div>
                    </div>
                    
                    <button id="clear-data-btn" class="btn btn-secondary reveal-right" style="transition-delay: 0.5s; width: 100%; border-color: rgba(255, 107, 107, 0.5); color: var(--color-accent);">Clear Demo Data</button>
                    
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Chennai Pulse. Academic Frontend Project.</p>
            </div>
        </div>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages/profile.js"></script>
</body>
</html>
